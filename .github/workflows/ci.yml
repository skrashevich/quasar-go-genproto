name: checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-protobuf
      - name: Verify freequasar compatibility
        run: sh scripts/check-compat.sh
      - name: Check the original Go API
        run: |
          go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba
          sh scripts/check-api.sh
      - name: Verify generated bindings
        run: python3 scripts/update-protos.py --check
      - run: go test ./...
      - run: go vet ./...
  minimum-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.0'
      - name: Compile and test with the minimum supported Go version
        env:
          GOTOOLCHAIN: local
        run: |
          go test ./...
